<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8"/>
    <link rel="icon" href="/favicon.ico"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"/>
    <meta name="theme-color" content="#000000"/>
    <meta name="description" content="Among Us Map Editor"/>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/manifest.json"/>
    <title>LevelImposter Editor</title>
    
    <!-- Inline CSS for splash screen -->
    <style>
        #splashscreen {

            pointer-events: none;
            transition: opacity 0.4s ease-in-out;
            opacity: 1;

            position: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgb(18, 18, 18);
            z-index: 9999; /* Ensure it covers everything */
        }

        #progress-bar {
            width: 200px;
            height: 10px;
            background-color: #007bff;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 20px;
        }

        #progress-fill {
            width: 100%;
            height: 100%;
            animation: progress 1s linear infinite;
            background-image: linear-gradient(45deg, rgba(255, 255, 255, .15) 25%, transparent 25%, transparent 50%, rgba(255, 255, 255, .15) 50%, rgba(255, 255, 255, .15) 75%, transparent 75%, transparent);
            background-size: 1rem 1rem;
        }

        @keyframes progress {
            0% {
                background-position: 0 0;
            }
            100% {
                background-position: 1rem 0;
            }
        }
    </style>
</head>

<body style="margin: 0; padding: 0; overflow: hidden;">
<noscript>You need to enable JavaScript to run this app.</noscript>

<div id="splashscreen">
    <!-- Logo -->
    <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 284 296"
            width="55"
            height="55"
    >
        <polygon fill="white" points="48 0 48 252 192 252 192 296 0 296 0 0 48 0"/>
        <rect fill="white" x="236" width="48" height="296"/>
    </svg>

    <!-- Progress Bar -->
    <div id="progress-bar">
        <div id="progress-fill"></div>
    </div>
</div>

<div id="root"></div>
<script type="module" src="/src/index.tsx"></script>
</body>

</html>
